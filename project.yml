name: AIExcuseMaker
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.aiexcusemaker
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic

targets:
  AIExcuseMaker:
    type: application
    platform: iOS
    sources: [AIExcuseMaker]
    settings:
      base:
        PRODUCT_NAME: AIExcuseMaker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AIExcuseMaker/Info.plist
      properties:
        CFBundleName: "AI言い訳メーカー"
        CFBundleDisplayName: "AI言い訳メーカー"
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        GADApplicationIdentifier: "ca-app-pub-9404799280370656~7205926383"
        NSUserTrackingUsageDescription: "より良い広告を表示するために使用します。"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
